name: CI

on:
    push:
        branches:
            -main
    pull-request:
        branches:
            -main

jobs:
    validate:
        runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 24
            cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker Image
        run: docker build -t website:latest .
